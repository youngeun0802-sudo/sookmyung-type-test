<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 숙명 유형 찾기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: 가운데 한 열(최대 560px). 질문은 한 장씩, 결과는 히어로 → 기회 목록(한 줄 요약 상시 노출, 눌러서 상세) → 선배 이야기. 숙명 로열블루 + 로열옐로 포인트 */
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --sunken: #f0f2f8;
  --fg: #151b2c;
  --muted: #646d86;
  --line: #e3e7f0;
  --royal: #003087;
  --royal-soft: #eaf0fa;
  --yellow: #ffb500;
  --on-royal: #ffffff;
  --display: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1323; --surface: #151d32; --sunken: #111829; --fg: #e9edf6; --muted: #98a2bc; --line: #253049;
    --royal: #86a7ff; --royal-soft: #1b2649; --yellow: #ffc533; --on-royal: #0d1323; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1323; --surface: #151d32; --sunken: #111829; --fg: #e9edf6; --muted: #98a2bc; --line: #253049;
  --royal: #86a7ff; --royal-soft: #1b2649; --yellow: #ffc533; --on-royal: #0d1323; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 56px;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; min-width: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px; }
.brand { display: flex; align-items: center; background: #ffffff; border-radius: 12px; padding: 6px 10px; }
.brand img { display: block; height: 30px; width: auto; max-width: 100%; }
.top { padding: 0; }
.top .meta { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.4; }
.draft { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
#stage { display: grid; gap: 16px; min-width: 0; }

.card { background: var(--surface); border-radius: 20px; padding: 28px 24px; display: grid; gap: 20px; min-width: 0; box-shadow: 0 1px 2px rgba(10, 20, 50, .04); }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.3; }
h1 { font-family: var(--display); font-weight: 600; letter-spacing: -.02em; font-size: clamp(30px, 8vw, 38px); color: var(--royal); }
h2 { font-weight: 600; font-size: clamp(20px, 5.4vw, 23px); letter-spacing: -.01em; }
h3 { font-weight: 600; font-size: 17px; }
p { margin: 0; }
.lead { color: var(--muted); font-size: 15px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--royal); }

.btn { font: inherit; font-weight: 600; border: 0; border-radius: 14px; padding: 15px 20px; cursor: pointer; background: var(--royal); color: var(--on-royal); }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--sunken); color: var(--fg); }
.btn.full { width: 100%; }
button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

.qhead { display: grid; gap: 10px; }
.meter { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--royal); border-radius: 99px; transition: width .25s ease; }
.qmeta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qmeta b { color: var(--royal); }
.opts { display: grid; gap: 8px; }
.opt { font: inherit; font-size: 16px; text-align: left; background: var(--sunken); color: var(--fg); border: 1.5px solid transparent; border-radius: 14px; padding: 15px 18px; cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--royal); background: var(--royal-soft); }
.back { justify-self: start; background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; padding: 2px 0; }
.back:hover { color: var(--royal); }

.hero { background: var(--royal); color: var(--on-royal); border-radius: 20px; padding: 28px 24px; display: grid; gap: 10px; }
.profile { display: grid; grid-template-columns: 1fr 1.1fr; gap: 10px; background: #ffffff; border-radius: 18px; padding: 10px; margin: 6px 0 4px; color: #151b2c; }
.profile .pic { min-width: 0; }
.profile .pic img { display: block; width: 100%; height: auto; aspect-ratio: 1; border-radius: 12px; }
.panels { display: grid; gap: 8px; align-content: start; min-width: 0; }
.panel { background: #f2f4fa; border-radius: 12px; padding: 10px 12px; }
.panel h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: #003087; padding-bottom: 5px; border-bottom: 1.5px solid #c9d4ea; }
.panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.panel li { font-size: 12.5px; line-height: 1.45; padding-left: 12px; position: relative; }
.panel li::before { content: ""; position: absolute; left: 0; top: 7px; width: 6px; height: 6px; border-radius: 2px; background: #ffb500; transform: rotate(45deg); }
.panel.lv { background: #003087; color: #ffffff; }
.panel.lv h4 { color: #ffd166; border-color: rgba(255,255,255,.25); }
.panel.lv li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding-left: 0; }
.panel.lv li::before { display: none; }
.panel.lv b { font-weight: 600; color: #ffd166; font-variant-numeric: tabular-nums; }
.panel.lv i { grid-column: 1 / -1; height: 4px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.panel.lv em { display: block; height: 100%; background: #ffd166; border-radius: 99px; }
@media (max-width: 380px) { .profile { grid-template-columns: 1fr; } .profile .pic img { width: 70%; margin: 0 auto; } }
.hero .tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; opacity: .85; }
.hero h1 { color: inherit; font-size: clamp(32px, 9vw, 42px); }
.hero .ask { font-size: 15px; opacity: .88; }
.hero .chance { justify-self: start; margin-top: 6px; background: var(--yellow); color: #151b2c; font-weight: 600; font-size: 14px; border-radius: 99px; padding: 6px 14px; }

.sec { display: grid; gap: 12px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sec-head span { font-size: 12px; color: var(--muted); }

ol.opps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.opp { background: var(--sunken); border-radius: 14px; }
.opp > button { font: inherit; color: inherit; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: 26px 1fr 20px; column-gap: 10px; row-gap: 2px; align-items: start; border-radius: 14px; }
.opp .no { grid-row: span 2; font-weight: 600; color: var(--royal); font-variant-numeric: tabular-nums; font-size: 15px; padding-top: 1px; }
.opp .ttl { font-weight: 600; font-size: 15.5px; }
.opp .one { grid-column: 2; font-size: 14px; color: var(--muted); line-height: 1.5; }
.opp .chev { grid-row: 1; grid-column: 3; width: 20px; height: 20px; color: var(--muted); transition: transform .2s; }
.opp[data-open="true"] .chev { transform: rotate(180deg); }
.opp .more { display: none; padding: 0 16px 16px 52px; font-size: 14.5px; line-height: 1.65; }
.opp[data-open="true"] .more { display: grid; gap: 6px; }
.more b { color: var(--royal); }
.chk { font-size: 11px; font-weight: 600; color: var(--muted); }

.story { display: grid; gap: 0; }
.story p { font-size: 15px; line-height: 1.8; padding: 14px 0; border-top: 1px solid var(--line); }
.story p:first-child { border-top: 0; padding-top: 0; }
.story p strong { color: var(--royal); }

.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 84px 1fr 24px; gap: 12px; align-items: center; font-size: 13px; }
.bar .track { height: 8px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--line); border-radius: 99px; }
.bar.win .fill { background: var(--royal); }
.bar.win span:first-child { font-weight: 600; color: var(--royal); }
.bar span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.others { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.others button { font: inherit; font-size: 14px; font-weight: 600; text-align: left; background: var(--sunken); color: var(--fg); border: 0; border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.others button:hover { background: var(--royal-soft); color: var(--royal); }
.note { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .card, .hero { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(5px); } to { transform: none; } }
}
</style>
</head>

  { q: "내 노트 필기 스타일은?", opts: [["여백에 아이디어 낙서 가득", 3], ["표로 깔끔하게 정리", 2], ["단톡방에 공유하는 필기 담당", 4], ["과목끼리 연결하는 마인드맵", 1]] },
  { q: "방학에 딱 하나만 할 수 있다면?", opts: [["원데이 클래스 여러 개 체험", 1], ["봉사단 리더 맡기", 4], ["과학관에서 하루 종일 체험", 2], ["굿즈 만들어 플리마켓 판매", 3]] },
  { q: "4년 뒤 졸업식, 가장 듣고 싶은 말은?", opts: [["“네 덕분에 많은 사람이 편해졌대!”", 2], ["“두 전공 엮어서 너만의 길을 만들었네!”", 1], ["“네가 이끈 팀 덕분이야!”", 4], ["“네 아이디어가 진짜 서비스가 됐어!”", 3]] }
];
const stage = document.getElementById("stage");
let answers = [];
const CHEV = `<svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; }

function intro() {
  answers = [];
  stage.replaceChildren(el(`
    <section class="card">
      <span class="eyebrow">예비 송이를 위한 10문항 · 1분</span>
      <h1>나는 숙명에서<br>어떤 4년을 보낼까?</h1>
      <p class="lead">고민하지 말고 바로 떠오르는 걸 골라요. 나와 닮은 유형, 숙명이 줄 수 있는 기회, 같은 길을 먼저 간 선배들의 이야기를 보여줄게요.</p>
      <button class="btn full" id="start">테스트 시작하기</button>
    </section>`));
  document.getElementById("start").onclick = () => ask(0);
}

function ask(i) {
  const item = QUESTIONS[i];
  stage.replaceChildren(el(`
    <section class="card">
      <div class="qhead">
        <div class="meter"><i style="width:${(i / QUESTIONS.length) * 100}%"></i></div>
        <div class="qmeta"><span><b>Q${i + 1}</b> / ${QUESTIONS.length}</span>${i > 0 ? `<button class="back" id="back">← 이전</button>` : ""}</div>
      </div>
      <h2>${item.q}</h2>
      <div class="opts">${item.opts.map((o, k) => `<button class="opt" data-k="${k}">${o[0]}</button>`).join("")}</div>
    </section>`));
  stage.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    answers[i] = item.opts[+b.dataset.k][1];
    answers.length = i + 1;
    i + 1 < QUESTIONS.length ? ask(i + 1) : result();
  });
  const back = stage.querySelector("#back");
  if (back) back.onclick = () => ask(i - 1);
}

function score(list) {
  const s = { 1: 0, 2: 0, 3: 0, 4: 0 };
  list.forEach(t => s[t]++);
  const max = Math.max(...Object.values(s));
  const top = Object.keys(s).filter(k => s[k] === max).map(Number);
  const last = list[list.length - 1];
  const win = top.length === 1 ? top[0] : (top.includes(last) ? last : top[0]);
  return { s, win, tie: top.length > 1 };
}

function result(forced) {
  const { s, win, tie } = score(answers);
  const id = forced || win;
  const t = TYPES[id];
  const opps = t.opps.map((o, n) => `
    <li class="opp" data-open="false">
      <button aria-expanded="false"><span class="no">${String(n + 1).padStart(2, "0")}</span><span class="ttl">${o.t}</span>${CHEV}<span class="one">${o.o}</span></button>
      <div class="more"><span>${o.d}</span>${o.check ? `<span class="chk">· 확인 필요</span>` : ""}</div>
    </li>`).join("");
  const story = t.people.map(p => `<p>${p}</p>`).join("");
  const bars = [1, 2, 3, 4].map(k => `
    <div class="bar ${k === win ? "win" : ""}"><span>${TYPES[k].short}</span>
      <div class="track"><div class="fill" style="width:${(s[k] / QUESTIONS.length) * 100}%"></div></div><span>${s[k]}</span></div>`).join("");
  const others = [1, 2, 3, 4].filter(k => k !== id).map(k => `<button data-t="${k}">${TYPES[k].name} →</button>`).join("");
  stage.replaceChildren(el(`
    <section class="hero">
      <span class="tag">${forced && forced !== win ? "다른 유형 살펴보기" : "나의 숙명 유형"}</span>
      <h1>${t.name}</h1>
      <div class="profile">
        <div class="pic"><img src="${IMGS[id]}" alt="${t.name} 캐릭터" width="1200" height="1200"></div>
        <div class="panels">
          <div class="panel"><h4>특징</h4><ul>${t.feat.map(f => `<li>${f}</li>`).join("")}</ul></div>
          <div class="panel lv"><h4>레벨</h4><ul>${t.lv.map(([k, n]) => `<li><span>${k}</span><b>Lv.${n}</b><i><em style="width:${n * 10}%"></em></i></li>`).join("")}</ul></div>
        </div>
      </div>
      <p class="ask">“${t.ask}”</p>
      <span class="chance">${t.chance}</span>
    </section>
    <section class="card">
      <div class="sec">
        <div class="sec-head"><h3>숙명이 줄 수 있는 기회</h3><span>눌러서 자세히</span></div>
        <ol class="opps">${opps}</ol>
      </div>
    </section>
    <section class="card">
      <div class="sec">
        <div class="sec-head"><h3>먼저 걸어간 송이들</h3></div>
        <div class="story">${story}</div>
      </div>
    </section>
    <section class="card">
      <div class="sec"><div class="sec-head"><h3>내 답변 분포</h3></div><div class="bars">${bars}</div>
        ${tie ? `<p class="note">동점 유형이 있어서 마지막 질문(4년 뒤 듣고 싶은 말)의 답으로 결과를 정했어요.</p>` : ""}</div>
      <div class="sec"><div class="sec-head"><h3>다른 유형도 궁금하다면</h3></div><div class="others">${others}</div></div>
      <div class="row">
        ${forced && forced !== win ? `<button class="btn" id="mine">내 결과로 돌아가기</button>` : ""}
        <button class="btn ghost" id="again">처음부터 다시 하기</button>
      </div>
      <p class="note">1차본 · 숙명여대 공식 홈페이지와 언론 보도(2026.11 기준)를 바탕으로 정리했어요.</p>
    </section>`));
  stage.querySelectorAll(".opp > button").forEach(b => b.onclick = () => {
    const li = b.parentElement, open = li.dataset.open !== "true";
    li.dataset.open = open; b.setAttribute("aria-expanded", open);
  });
  stage.querySelectorAll(".others button").forEach(b => b.onclick = () => result(+b.dataset.t));
  stage.querySelector("#again").onclick = intro;
  const mine = stage.querySelector("#mine");
  if (mine) mine.onclick = () => result();
  window.scrollTo({ top: 0 });
}

intro();
</script>

</body>
</html>
